<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Casa Masculina 🏛️ | Since 2025</title>

    <meta name="description" content="Casa Masculina — roupas, acessórios, perfumes e estilo masculino.">
    <meta name="theme-color" content="#080b0e">

    <style>
        :root{
            --bg:#050709;
            --bg2:#090d11;
            --panel:#0c1116;
            --panel2:#11171c;
            --line:#30373d;

            /* Cinza escuro inspirado em templo grego */
            --accent:#737a80;
            --accent-light:#aeb4b8;
            --accent-dark:#444a4f;

            --text:#f4f4f2;
            --muted:#9da4aa;

            --green:#25d366;

            --radius:18px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            background:var(--bg);
            color:var(--text);
            font-family:Arial, Helvetica, sans-serif;
            line-height:1.5;
        }

        button,
        input{
            font:inherit;
        }

        button{
            cursor:pointer;
        }

        a{
            color:inherit;
            text-decoration:none;
        }

        img{
            max-width:100%;
            display:block;
        }

        /* =========================
           HEADER
        ========================= */

        header{
            position:sticky;
            top:0;
            z-index:1000;
            background:rgba(5,7,9,.96);
            border-bottom:1px solid var(--line);
            backdrop-filter:blur(14px);
        }

        .nav{
            max-width:1250px;
            margin:auto;
            min-height:78px;
            padding:12px 20px;
            display:flex;
            align-items:center;
            gap:22px;
        }

        .brand{
            display:flex;
            align-items:center;
            gap:12px;
            min-width:max-content;
        }

        .brand img{
            width:50px;
            height:50px;
            border-radius:50%;
            object-fit:cover;
            border:1px solid var(--accent);
            background:#111;
        }

        .brand-name{
            font-family:Georgia, "Times New Roman", serif;
            font-size:22px;
            letter-spacing:1px;
            white-space:nowrap;
        }

        .brand-since{
            display:block;
            color:var(--muted);
            font-family:Arial, sans-serif;
            font-size:10px;
            letter-spacing:3px;
            margin-top:-3px;
        }

        .search-top{
            flex:1;
            max-width:560px;
            margin:auto;
            position:relative;
        }

        .search-top input{
            width:100%;
            height:44px;
            padding:0 48px 0 18px;
            border-radius:24px;
            border:1px solid var(--line);
            outline:none;
            background:#0c1115;
            color:var(--text);
        }

        .search-top input:focus{
            border-color:var(--accent);
        }

        .search-icon{
            position:absolute;
            right:17px;
            top:50%;
            transform:translateY(-50%);
            color:var(--muted);
        }

        .nav-actions{
            display:flex;
            align-items:center;
            gap:10px;
        }

        .icon-btn{
            width:44px;
            height:44px;
            border-radius:50%;
            border:1px solid var(--line);
            background:#0c1115;
            color:var(--text);
            display:flex;
            align-items:center;
            justify-content:center;
            position:relative;
            transition:.2s;
        }

        .icon-btn:hover{
            border-color:var(--accent-light);
            background:#151b20;
        }

        .cart-count{
            position:absolute;
            right:-3px;
            top:-5px;
            min-width:19px;
            height:19px;
            padding:0 5px;
            border-radius:20px;
            background:var(--accent-light);
            color:#090b0d;
            font-size:11px;
            font-weight:bold;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .quick-links{
            max-width:1250px;
            margin:auto;
            padding:0 20px 12px;
            display:flex;
            justify-content:center;
            gap:25px;
            flex-wrap:wrap;
        }

        .quick-links a{
            color:var(--muted);
            font-size:13px;
            transition:.2s;
        }

        .quick-links a:hover{
            color:white;
        }

        /* =========================
           HERO
        ========================= */

        .hero{
            min-height:650px;
            position:relative;
            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            overflow:hidden;

            background-image:
                linear-gradient(
                    rgba(3,5,7,.45),
                    rgba(3,5,7,.78)
                ),
                url("cartaz_casa_masculina.jpg");

            background-size:cover;
            background-position:center;
        }

        .hero::after{
            content:"";
            position:absolute;
            inset:0;
            background:
                linear-gradient(
                    90deg,
                    rgba(0,0,0,.50),
                    transparent 50%,
                    rgba(0,0,0,.45)
                );
            pointer-events:none;
        }

        .hero-content{
            position:relative;
            z-index:2;
            max-width:850px;
            padding:70px 20px;
        }

        .hero-small{
            font-size:12px;
            letter-spacing:5px;
            text-transform:uppercase;
            color:#ddd;
            margin-bottom:14px;
        }

        .hero h1{
            font-family:Georgia, "Times New Roman", serif;
            font-size:clamp(42px,7vw,82px);
            line-height:1;
            letter-spacing:2px;
            text-shadow:0 4px 25px #000;
            margin-bottom:18px;
        }

        .hero p{
            max-width:620px;
            margin:0 auto 28px;
            color:#eee;
            font-size:17px;
            text-shadow:0 2px 8px #000;
        }

        .hero-button{
            display:inline-flex;
            align-items:center;
            gap:10px;
            border:1px solid #d0d4d7;
            background:#111518;
            color:white;
            padding:14px 28px;
            border-radius:30px;
            font-weight:bold;
            letter-spacing:1px;
            transition:.25s;
        }

        .hero-button:hover{
            background:#e5e7e8;
            color:#080a0c;
        }

        .hero-logo{
            margin:28px auto 0;
            width:105px;
            height:105px;
            padding:8px;
            border-radius:50%;
            background:rgba(5,7,9,.72);
            border:1px solid rgba(220,220,220,.55);
            box-shadow:0 8px 30px rgba(0,0,0,.5);
        }

        .hero-logo img{
            width:100%;
            height:100%;
            object-fit:cover;
            border-radius:50%;
        }

        /* =========================
           SECTIONS
        ========================= */

        .section{
            max-width:1250px;
            margin:auto;
            padding:70px 20px;
        }

        .section-header{
            text-align:center;
            margin-bottom:35px;
        }

        .section-kicker{
            color:var(--accent-light);
            font-size:11px;
            letter-spacing:4px;
            text-transform:uppercase;
            margin-bottom:8px;
        }

        .section-title{
            font-family:Georgia, "Times New Roman", serif;
            font-size:38px;
            letter-spacing:.5px;
        }

        /* =========================
           CATEGORIAS
        ========================= */

        .categories{
            display:flex;
            gap:18px;
            overflow-x:auto;
            padding:5px 3px 18px;
            scrollbar-width:thin;
            scrollbar-color:var(--accent-dark) transparent;
        }

        .category{
            flex:0 0 88px;
            border:0;
            background:transparent;
            color:var(--text);
            text-align:center;
        }

        .category-icon{
            width:70px;
            height:70px;
            margin:0 auto 9px;
            border-radius:50%;
            border:1px solid var(--line);
            background:
                radial-gradient(
                    circle at 50% 35%,
                    #30373c,
                    #101419 65%
                );
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            transition:.2s;
        }

        .category-icon img{
            width:48px;
            height:48px;
            object-fit:cover;
            border-radius:50%;
            opacity:.92;
        }

        .category-icon span{
            font-size:27px;
            filter:grayscale(1);
        }

        .category:hover .category-icon,
        .category.active .category-icon{
            border-color:var(--accent-light);
            transform:translateY(-3px);
            box-shadow:0 7px 22px rgba(0,0,0,.4);
        }

        .category-name{
            font-size:12px;
            color:var(--muted);
            white-space:nowrap;
        }

        .category.active .category-name{
            color:white;
            font-weight:bold;
        }

        /* =========================
           PRODUTOS
        ========================= */

        .products-grid{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:24px;
        }

        .product{
            background:var(--panel);
            border:1px solid var(--line);
            border-radius:var(--radius);
            overflow:hidden;
            transition:.25s;
        }

        .product:hover{
            transform:translateY(-4px);
            border-color:#60676d;
            box-shadow:0 15px 35px rgba(0,0,0,.25);
        }

        .product-image{
            height:330px;
            background:#11161a;
            position:relative;
            overflow:hidden;
        }

        .product-image img{
            width:100%;
            height:100%;
            object-fit:cover;
            transition:.35s;
        }

        .product:hover .product-image img{
            transform:scale(1.035);
        }

        .image-placeholder{
            width:100%;
            height:100%;
            display:flex;
            align-items:center;
            justify-content:center;
            color:#656c72;
            font-size:55px;
            background:
                radial-gradient(
                    circle,
                    #20262b,
                    #0d1115
                );
        }

        .product-category{
            position:absolute;
            top:12px;
            left:12px;
            padding:6px 10px;
            border-radius:20px;
            background:rgba(5,7,9,.8);
            border:1px solid rgba(255,255,255,.18);
            font-size:10px;
            color:#ddd;
        }

        .product-info{
            padding:19px;
        }

        .product-name{
            font-family:"Trebuchet MS", Arial, sans-serif;
            font-size:18px;
            font-weight:700;
            margin-bottom:6px;
        }

        .product-description{
            color:var(--muted);
            font-size:13px;
            min-height:40px;
        }

        .product-bottom{
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            margin-top:16px;
        }

        .price{
            font-family:Georgia, "Times New Roman", serif;
            font-size:21px;
            font-weight:bold;
        }

        .add-btn{
            border:1px solid var(--accent);
            background:#1b2024;
            color:white;
            border-radius:24px;
            padding:9px 15px;
            font-size:12px;
            font-weight:bold;
            transition:.2s;
        }

        .add-btn:hover{
            background:#e0e2e3;
            color:#080a0c;
        }

        .empty-products{
            grid-column:1/-1;
            padding:60px;
            text-align:center;
            color:var(--muted);
        }

        /* =========================
           BANNER
        ========================= */

        .quality-banner{
            max-width:1250px;
            margin:0 auto 70px;
            padding:55px 25px;
            border-top:1px solid var(--line);
            border-bottom:1px solid var(--line);
            text-align:center;
            background:
                radial-gradient(
                    circle at center,
                    #1a2025,
                    #090c0f 65%
                );
        }

        .quality-banner h2{
            font-family:Georgia, "Times New Roman", serif;
            font-size:35px;
            margin-bottom:10px;
        }

        .quality-banner p{
            max-width:650px;
            margin:auto;
            color:var(--muted);
        }

        /* =========================
           SOBRE / CONTATO
        ========================= */

        .info-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:25px;
        }

        .info-card{
            padding:30px;
            background:var(--panel);
            border:1px solid var(--line);
            border-radius:var(--radius);
        }

        .info-card h3{
            font-family:Georgia, "Times New Roman", serif;
            font-size:25px;
            margin-bottom:12px;
        }

        .info-card p{
            color:var(--muted);
            font-size:14px;
        }

        .contact-list{
            margin-top:20px;
            display:grid;
            gap:12px;
        }

        .contact-item{
            padding:13px 15px;
            border-radius:12px;
            background:#11161a;
            border:1px solid var(--line);
            color:#ddd;
        }

        /* =========================
           FOOTER
        ========================= */

        footer{
            border-top:1px solid var(--line);
            background:#030506;
        }

        .footer{
            max-width:1250px;
            margin:auto;
            padding:50px 20px 25px;
            display:grid;
            grid-template-columns:1.4fr 1fr 1fr;
            gap:35px;
        }

        .footer-brand img{
            width:75px;
            height:75px;
            object-fit:cover;
            border-radius:50%;
            margin-bottom:15px;
            border:1px solid var(--line);
        }

        .footer-brand h3{
            font-family:Georgia, "Times New Roman", serif;
            font-size:25px;
            margin-bottom:7px;
        }

        .footer p,
        .footer a{
            color:var(--muted);
            font-size:13px;
        }

        .footer-column h4{
            margin-bottom:15px;
            font-size:14px;
            text-transform:uppercase;
            letter-spacing:2px;
        }

        .footer-column{
            display:flex;
            flex-direction:column;
            gap:9px;
        }

        .copyright{
            max-width:1250px;
            margin:auto;
            padding:20px;
            border-top:1px solid #171c20;
            text-align:center;
            color:#6f767b;
            font-size:11px;
        }

        /* =========================
           CARRINHO
        ========================= */

        .cart-overlay{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.72);
            z-index:2000;
            opacity:0;
            pointer-events:none;
            transition:.25s;
        }

        .cart-overlay.open{
            opacity:1;
            pointer-events:auto;
        }

        .cart-panel{
            position:absolute;
            right:0;
            top:0;
            width:min(440px,100%);
            height:100%;
            background:#090d10;
            border-left:1px solid var(--line);
            transform:translateX(100%);
            transition:.3s;
            display:flex;
            flex-direction:column;
        }

        .cart-overlay.open .cart-panel{
            transform:translateX(0);
        }

        .cart-header{
            padding:20px;
            border-bottom:1px solid var(--line);
            display:flex;
            align-items:center;
            justify-content:space-between;
        }

        .cart-header h2{
            font-family:Georgia, "Times New Roman", serif;
        }

        .close-cart{
            width:40px;
            height:40px;
            border-radius:50%;
            border:1px solid var(--line);
            background:#11161a;
            color:white;
        }

        .cart-items{
            flex:1;
            overflow:auto;
            padding:20px;
        }

        .cart-item{
            display:grid;
            grid-template-columns:65px 1fr auto;
            gap:12px;
            align-items:center;
            padding:12px 0;
            border-bottom:1px solid #1b2024;
        }

        .cart-item-image{
            width:65px;
            height:65px;
            border-radius:10px;
            object-fit:cover;
            background:#161b20;
        }

        .cart-item h4{
            font-size:14px;
        }

        .cart-item small{
            color:var(--muted);
            font-size:12px;
        }

        .cart-item-price{
            font-weight:bold;
            font-size:13px;
        }

        .cart-footer{
            padding:20px;
            border-top:1px solid var(--line);
        }

        .cart-total{
            display:flex;
            align-items:center;
            justify-content:space-between;
            font-size:19px;
            margin-bottom:15px;
        }

        .whatsapp-btn{
            width:100%;
            border:0;
            border-radius:13px;
            background:var(--green);
            color:#071008;
            padding:14px;
            font-weight:bold;
            transition:.2s;
        }

        .whatsapp-btn:hover{
            filter:brightness(1.08);
        }

        .clear-cart{
            width:100%;
            margin-top:9px;
            border:1px solid var(--line);
            border-radius:13px;
            background:transparent;
            color:var(--muted);
            padding:11px;
        }

        .cart-empty{
            text-align:center;
            color:var(--muted);
            padding:60px 20px;
        }

        /* =========================
           TOAST
        ========================= */

        .toast{
            position:fixed;
            left:50%;
            bottom:25px;
            transform:translate(-50%,20px);
            background:#e7e9ea;
            color:#080a0c;
            padding:12px 18px;
            border-radius:30px;
            font-size:13px;
            font-weight:bold;
            z-index:3000;
            opacity:0;
            pointer-events:none;
            transition:.25s;
        }

        .toast.show{
            opacity:1;
            transform:translate(-50%,0);
        }

        /* =========================
           RESPONSIVO
        ========================= */
