<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa Masculina 🏛️ | Since 2025</title>
<style>
:root{
  
  --bg:#03080e;
  --panel:#071019;
  --panel2:#0b151f;
  --line:#2b3540;
  --text:#f5f5f3;
  --muted:#aeb4bb;
  --gold:#d7b56d;
  --gold2:#f0d898;
  --green:#25d366;
  --danger:#ff5555;
}
  
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}
html{
  scroll-behavior:smooth;
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:Georgia,"Times New Roman",serif;
  overflow-x:hidden;
}
button,
input{
  font-family:inherit;
}
button{
  cursor:pointer;
}
  
/* ================= HEADER ================= */
  
header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(3,8,14,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.nav{
  max-width:1200px;
  margin:auto;
  min-height:72px;
  padding:12px 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}
.logo{
  color:var(--gold2);
  font-size:25px;
  font-weight:bold;
  text-decoration:none;
  white-space:nowrap;
}
nav{
  display:flex;
  align-items:center;
  gap:22px;
}
nav a{
  color:var(--text);
  text-decoration:none;
  font-size:15px;
}
nav a:hover{
  color:var(--gold2);
}
.header-cart{
  border:1px solid var(--gold);
  background:transparent;
  color:var(--gold2);
  padding:10px 14px;
  border-radius:8px;
  font-weight:bold;
}
.header-cart:hover{
  background:var(--gold);
  color:#000;
}
/* ================= HERO ================= */
.hero{
  min-height:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:70px 20px;
  position:relative;
  background:
    linear-gradient(rgba(3,8,14,.72),rgba(3,8,14,.88)),
    url("./casa_masculina_hero.jpg") center/cover no-repeat;
}
.hero-content{
  max-width:850px;
}
.hero h1{
  font-size:clamp(42px,8vw,82px);
  color:#fff;
  margin-bottom:16px;
  letter-spacing:1px;
}
.hero h1 span{
  color:var(--gold2);
}
.hero p{
  color:#d6d9dc;
  font-size:19px;
  line-height:1.6;
  margin-bottom:30px;
}
.hero-buttons{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:12px;
}
.btn{
  display:inline-block;
  padding:14px 22px;
  border-radius:8px;
  text-decoration:none;
  border:1px solid var(--gold);
  font-weight:bold;
  transition:.2s;
}
.btn-gold{
  background:var(--gold);
  color:#050505;
}
.btn-outline{
  color:var(--gold2);
  background:transparent;
}
.btn:hover{
  transform:translateY(-2px);
}
/* ================= PROMO ================= */
.promo{
  max-width:1150px;
  margin:35px auto 0;
  padding:0 20px;
}
.promo-box{
  border:1px solid var(--gold);
  background:linear-gradient(135deg,#0b151f,#111c27);
  border-radius:15px;
  padding:28px;
  text-align:center;
}
.promo-box h2{
  color:var(--gold2);
  margin-bottom:8px;
}
.promo-box p{
  color:var(--muted);
}
/* ================= SECTIONS ================= */
section{
  padding:70px 20px;
}
.container{
  max-width:1150px;
  margin:auto;
}
.section-title{
  text-align:center;
  margin-bottom:35px;
}
.section-title h2{
  font-size:36px;
  color:var(--gold2);
  margin-bottom:8px;
}
.section-title p{
  color:var(--muted);
}
/* ================= CATEGORIAS ================= */
.categories{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:35px;
}
.category-btn{
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
  padding:10px 17px;
  border-radius:30px;
}
.category-btn:hover,
.category-btn.active{
  background:var(--gold);
  color:#000;
  border-color:var(--gold);
}
/* ================= BUSCA ================= */
.search{
  max-width:600px;
  margin:0 auto 35px;
}
.search input{
  width:100%;
  background:var(--panel);
  color:#fff;
  border:1px solid var(--line);
  padding:15px 18px;
  border-radius:9px;
  outline:none;
}
.search input:focus{
  border-color:var(--gold);
}
/* ================= PRODUTOS ================= */
.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
}
.product{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden;
  transition:.2s;
}
.product:hover{
  transform:translateY(-4px);
  border-color:#74633d;
}
.pic{
  width:100%;
  height:250px;
  background:#0b1219;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.pic .emoji{
  font-size:85px;
}
.product-info{
  padding:17px;
}
.product-info h3{
  font-size:19px;
  margin-bottom:6px;
}
.product-info p{
  color:var(--muted);
  font-size:14px;
  min-height:38px;
}
.price{
  color:var(--gold2);
  font-size:21px;
  font-weight:bold;
  margin:12px 0;
}
.add-btn{
  width:100%;
  padding:12px;
  border:1px solid var(--gold);
  border-radius:8px;
  background:transparent;
  color:var(--gold2);
  font-weight:bold;
}
.add-btn:hover{
  background:var(--gold);
  color:#000;
}
/* ================= MASCOTE ================= */
.mascote-area{
  text-align:center;
}
.mascote{
  width:180px;
  max-width:70%;
  margin:auto;
  display:block;
}
/* ================= FOOTER ================= */
footer{
  border-top:1px solid var(--line);
  padding:45px 20px;
  background:#02060b;
}
.footer-content{
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:30px;
}
.footer-logo{
  width:100px;
  margin-bottom:15px;
}
footer h3{
  color:var(--gold2);
  margin-bottom:12px;
}
footer p,
footer a{
  color:var(--muted);
  line-height:1.8;
  text-decoration:none;
}
footer a:hover{
  color:var(--gold2);
}
.copyright{
  text-align:center;
  color:#707780;
  margin-top:35px;
  padding-top:25px;
  border-top:1px solid var(--line);
}
/* ================= WHATSAPP ================= */
.whatsapp{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:1500;
  width:58px;
  height:58px;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  text-decoration:none;
  font-size:28px;
  box-shadow:0 5px 20px rgba(0,0,0,.4);
}
/* ================= CARRINHO ================= */
.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  z-index:1900;
  display:none;
}
.cart-overlay.open{
  display:block;
}
.cart{
  position:fixed;
  top:0;
  right:-430px;
  width:min(430px,100%);
  height:100vh;
  background:#071019;
  border-left:1px solid var(--line);
  z-index:2000;
  transition:.3s ease;
  display:flex;
  flex-direction:column;
}
.cart.open{
  right:0;
}
.cart-header{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.cart-header h2{
  color:var(--gold2);
}
.close-cart{
  background:none;
  border:0;
  color:#fff;
  font-size:28px;
}
.cart-body{
  flex:1;
  overflow-y:auto;
  padding:20px;
}
.empty-cart{
  color:var(--muted);
  text-align:center;
  padding:50px 20px;
}
.cart-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  border-bottom:1px solid var(--line);
  padding:15px 0;
}
.cart-item h4{
  margin-bottom:5px;
}
.cart-item small{
  color:var(--muted);
}
.cart-item-right{
  text-align:right;
  white-space:nowrap;
}
.remove-btn{
  border:0;
  background:none;
  color:var(--danger);
  margin-top:7px;
}
.cart-footer{
  padding:20px;
  border-top:1px solid var(--line);
}
.total{
  display:flex;
  justify-content:space-between;
  font-size:22px;
  font-weight:bold;
  margin-bottom:15px;
}
.total span:last-child{
  color:var(--gold2);
}
.checkout{
  width:100%;
}
