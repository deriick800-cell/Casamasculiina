<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Casa Masculina 🏛️ | Since 2025</title>

<style>

/* =========================================================
   CONFIGURAÇÕES GERAIS
========================================================= */

:root{
  --bg:#03080e;
  --panel:#071019;
  --panel2:#0b131c;
  --line:#2b3540;
  --text:#f5f5f3;
  --muted:#aeb4bb;
  --gold:#d7b56d;
  --gold2:#f0d898;
  --green:#25d366;
  --red:#e74c3c;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Georgia,"Times New Roman",serif;
  background:var(--bg);
  color:var(--text);
}

a{
  color:inherit;
  text-decoration:none;
}

button{
  font:inherit;
  cursor:pointer;
}


/* =========================================================
   MASCOTE
========================================================= */

.mascote{
  position:fixed;
  top:75px;
  right:12px;
  width:75px;
  z-index:999;
  pointer-events:none;
}

.mascote img{
  width:100%;
  height:auto;
  display:block;
  filter:drop-shadow(0 5px 10px rgba(0,0,0,.4));
}


/* =========================================================
   TOPO
========================================================= */

.topbar{
  display:flex;
  justify-content:space-around;
  gap:20px;
  padding:10px 4%;
  border-bottom:1px solid var(--line);
  font:11px Arial,sans-serif;
}

.topitem{
  display:flex;
  align-items:center;
  gap:9px;
  color:#ddd;
}

.topitem span{
  display:block;
  color:#89929b;
  font-size:9px;
}


/* =========================================================
   MENU
========================================================= */

.nav{
  height:82px;
  display:flex;
  align-items:center;
  gap:25px;
  padding:0 4%;
  border-bottom:1px solid var(--line);
  position:sticky;
  top:0;
  background:rgba(3,8,14,.96);
  backdrop-filter:blur(10px);
  z-index:500;
}

.menu{
  font-size:27px;
  background:none;
  border:0;
  color:#fff;
}

.logo{
  height:50px;
  width:150px;
  object-fit:contain;
  border-radius:8px;
}

.links{
  display:flex;
  gap:30px;
  margin:auto;
  font-size:13px;
  letter-spacing:2px;
}

.links a{
  padding:31px 0;
  border-bottom:1px solid transparent;
}

.links a:hover,
.links a.active{
  border-color:#fff;
}

.search{
  display:flex;
  border:1px solid #56606a;
  border-radius:10px;
  overflow:hidden;
  width:300px;
}

.search input{
  background:none;
  border:0;
  color:#fff;
  padding:12px 14px;
  width:100%;
  outline:0;
  font-family:Arial;
}

.search button{
  background:none;
  border:0;
  color:#fff;
  padding:0 14px;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  min-height:390px;
  display:flex;
  align-items:center;
  padding:0 8%;

  background:
  linear-gradient(
    90deg,
    rgba(3,8,14,.99),
    rgba(3,8,14,.88) 36%,
    rgba(3,8,14,.12) 78%
  ),
  url('casa_masculina_hero.jpg')
  center/cover no-repeat;

  border-bottom:1px solid var(--line);
}

.hero-content{
  max-width:570px;
}

.hero-logo{
  width:330px;
  max-width:80%;
  margin-bottom:15px;
}

.kicker{
  letter-spacing:6px;
  font-size:15px;
  line-height:1.8;
}

.hero h1{
  font-size:29px;
  letter-spacing:5px;
  font-weight:400;
  margin:8px 0 22px;
}

.btn{
  display:inline-flex;
  align-items:center;
  gap:17px;
  border:1px solid #c9cdd1;
  background:transparent;
  color:#fff;
  padding:13px 22px;
  letter-spacing:2px;
  font-size:11px;
  transition:.25s;
}

.btn:hover{
  background:#fff;
  color:#03080e;
}


/* =========================================================
   CATEGORIAS
========================================================= */

.categories{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  border-bottom:1px solid var(--line);
}

.cat{
  padding:21px 12px;
  text-align:center;
  border-right:1px solid #1c252e;
  transition:.2s;
}

.cat:hover{
  background:#0b131c;
}

.cat .ico{
  font-size:27px;
  margin-bottom:8px;
}

.cat b{
  font-size:12px;
  letter-spacing:1px;
  font-weight:400;
}

.cat small{
  display:block;
  color:#aaa;
  margin-top:6px;
  font:10px Arial;
}


/* =========================================================
   PRODUTOS
========================================================= */

.section{
  padding:38px 4%;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.section-title{
  letter-spacing:4px;
  font-size:18px;
  font-weight:400;
}

.products{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:14px;
}

.card{
  background:#050c13;
  border:1px solid #27323d;
  overflow:hidden;
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
  border-color:#7b858e;
}

.pic{
  height:190px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(
    circle at 50% 35%,
    #1d252c,
    #070d13 70%
  );
  position:relative;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.pic span{
  font-size:68px;
}

.badge{
  position:absolute;
  left:10px;
  top:10px;
  border:1px solid #ddd;
  padding:3px 6px;
  font:9px Arial;
  letter-spacing:1px;
}

.info{
  padding:13px;
  font-family:Arial,sans-serif;
}

.info h3{
  font:14px Georgia,serif;
  margin-bottom:7px;
}

.info p{
  font-size:10px;
  color:#aeb4bb;
  margin-bottom:8px;
}

.price{
  font-weight:bold;
  color:var(--gold2);
  margin-bottom:12px;
}

.buy{
  width:100%;
  padding:10px;
  background:transparent;
  color:#fff;
  border:1px solid #59636e;
  font-size:10px;
  letter-spacing:1px;
}

.buy:hover{
  background:#fff;
  color:#000;
}


/* =========================================================
   SOBRE
========================================================= */

.life{
  min-height:170px;
  padding:35px 7%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:50px;
  background:linear-gradient(90deg,#0b1117,#03080e);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  text-align:center;
}

.life h2{
  letter-spacing:5px;
  font-weight:400;
  font-size:22px;
}

.life p{
  font:12px Arial,sans-serif;
  color:#b7bdc4;
  max-width:390px;
  line-height:1.7;
}


/* =========================================================
   RODAPÉ
========================================================= */

.footer{
  padding:35px 7%;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr;
  gap:30px;
  font-family:Arial,sans-serif;
  color:#bfc4ca;
}

.footer img{
  width:180px;
  height:75px;
  object-fit:contain;
}

.footer h4{
  color:#fff;
  font-family:Georgia,serif;
  margin-bottom:14px;
  letter-spacing:2px;
}

.footer a{
  display:block;
  font-size:12px;
  margin:8px 0;
}

.copyright{
  grid-column:1/-1;
  text-align:center;
  border-top:1px solid #202a34;
  padding-top:20px;
  font-size:10px;
}


/* =========================================================
   CARRINHO
========================================================= */

.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  background:#fff;
  color:#000;
  border:0;
  border-radius:50%;
  width:58px;
  height:58px;
  font-size:20px;
  z-index:1500;
  box-shadow:0 5px 18px rgba(0,0,0,.4);
}

.cart-count{
  position:absolute;
  top:-5px;
  right:-5px;
  min-width:22px;
  height:22px;
  border-radius:50%;
  background:#d00;
  color:#fff;
  font:bold 12px Arial;
  display:flex;
  align-items:center;
  justify-content:center;
}

.cart-overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  z-index:1900;
  display:none;
}

.cart-overlay.open{
  display:block;
}

.cart-panel{
  position:fixed;
  top:0;
  right:-430px;
  width:min(430px,100%);
  height:100vh;
  background:#071019;
  z-index:2000;
  transition:.3s;
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
}

.cart-panel.open{
  right:0;
}

.cart-header{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
}

.cart-header h2{
  color:var(--gold2);
}

.close-cart{
  background:none;
  border:0;
  color:#fff;
  font-size:30px;
}

.cart-body{
  flex:1;
  overflow-y:auto;
  padding:20px;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:16px 0;
  border-bottom:1px solid var(--line);
}

.cart-item h3{
  font-size:15px;
  margin-bottom:5px;
}

.cart-item p{
  color:var(--muted);
  font:11px Arial;
}

.cart-item-price{
  color:var(--gold2);
  font-weight:bold;
}
